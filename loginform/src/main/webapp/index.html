<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex; /* Use flexbox for centering */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            height: 100vh; /* Full viewport height */
            margin: 0; /* Remove default margin */
            background-color: #f4f4f4; /* Light background for contrast */
        }
        .container {
            max-width: 400px; /* Max width for the form */
            background: white; /* White background for the form */
            padding: 20px; /* Padding inside the form */
            border-radius: 5px; /* Rounded corners */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }
        h1 {
            color: #333;
            text-align: center; /* Center heading text */
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 50%;
            padding: 10px;
            background-color: #4CAF50;
            color: white; 
            border: 2px solid black;
            border-radius: 0px;
            cursor: pointer; 
            margin-top: 10px;
            display: inline-block; /* Inline block for proper alignment */
        }
        button:hover {
            background-color: #45a049;
        }
        .forgot-password {
            text-align: right;
            margin-top: 10px;
        }
        .forgot-password a {
            color: #333;
            text-decoration: none;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        .registration {
            display: none; /* Hidden by default */
            margin-top: 20px;
        }
    </style>
    <script>
        function showRegistration() {
            document.getElementById('login-section').style.display = 'none'; // Hide the login section
            document.getElementById('registration-section').style.display = 'block'; // Show the registration section
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Login Form</h1>
        <div id="login-section">
            <button type="button" onclick="showLogin()">Login</button><button type="button" onclick="showRegistration()">Register</button>
            <form action="http://localhost:8080/loginform/action" method="POST">
                <input type="text" name="newuser" placeholder="Newuser" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Sign In</button>
            </form>
            <div class="forgot-password">
                <a href="http://localhost:8080/loginform/forgotpassword.html">Forgot Password?</a>
            </div>
        </div>

        <div id="registration-section" class="registration">
            <h2>Registration</h2>
            <form action="http://localhost:8080/loginform/register" method="POST">
                <input type="text" name="newusername" placeholder="New Username" required>
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
            <div class="forgot-password">
                <a href="http://localhost:8080/loginform/forgotpassword.html">Forgot Password?</a>
            </div>
        </div>
    </div>
</body>
</html>
